# picom compositor config. Added to replace awesome's client.shape-based
# corner rounding (a hard X11 Shape-extension cutout, no anti-aliasing --
# see BUILD-REPORT.md's Phase 5) with real, compositor-rendered rounded
# corners, plus shadows and fade -- closer to how the abandoned Hyprland
# setup looked. rc.lua's manual shape callback was removed to match:
# rounding is exclusively picom's job now, not double-applied.

backend = "glx";
vsync = true;

corner-radius = 10;
rounded-corners-exclude = [
  "class_g = 'Rofi'"
];
detect-rounded-corners = true;

shadow = true;
shadow-radius = 7;
shadow-opacity = 0.55;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-exclude = [
  "class_g = 'Rofi'"
];

fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;

detect-client-opacity = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-transient = true;
detect-client-leader = true;
use-damage = true;
