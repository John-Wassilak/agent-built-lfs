# hwdec=no: VAAPI decode on this GPU (GTX 770/GK104, nouveau) crashes
# rather than failing cleanly -- confirmed via `mpv -v` and independently
# via raw ffmpeg, both segfault at the same offset in libgallium-25.3.5.so
# (a real Mesa/nouveau gallium driver bug, RT_WIDTH_OVERRUN trap during
# hardware decode), not something fixable from mpv.conf. Software decode
# is fast enough on this box's CPU (i5-2500K) to be the safe default --
# see BUILD-REPORT.md's GPU deep-dive section for the full investigation.
hwdec=no
vo=gpu
ytdl-format="137+140/bestvideo[vcodec!~='(vp0?9|av0?1)'][id!=299]+bestaudio/best"
