# Begin /boot/grub/grub.cfg
#
# NVIDIA 470.xx + X11/awesome is the permanent setup as of 2026-08-26
# (operator decision, after the Hyprland/Wayland EGLStreams dead end --
# see BUILD-REPORT.md/AWESOME-X11-PLAN.md). The nouveau fallback entry
# was removed 2026-08-27, once the nvidia/X11/awesome path had proven
# itself stable across multiple reboots -- nouveau's own kernel driver
# is still compiled into the kernel image (removing that outright would
# mean a kernel reconfigure/rebuild, deliberately out of scope here),
# it's just never loaded: still blacklisted via cmdline below, same as
# before, just with no boot entry left that would ever lift the
# blacklist.
#
# snd_hda_intel.single_cmd=1 added 2026-08-27: audio regressed from
# its documented working state (BUILD-REPORT.md's "Audio: HDMI output
# working" checkpoint) -- every boot since (at least 5 checked) shows
# both HDA controllers (onboard 00:1b.0, nvidia HDMI 01:00.1) failing
# identically: `azx_get_response timeout, switching to polling mode`
# immediately followed by every codec slot failing to probe, ending
# in `Cannot probe codecs, giving up` on both. This is the well-known
# CORB/RIRB ring-buffer command-response failure pattern seen on
# older/quirky BIOS hardware (this board's BIOS is 2012-era, F1,
# never updated) -- single_cmd forces the older single-command codec
# interface instead of the ring buffer that's timing out. Untested
# until the next reboot (snd_hda_intel is compiled into this kernel,
# not a loadable module, so it can't be tried live first).
set default=0
set timeout=5

insmod part_msdos
insmod ext2

search --set=root --fs-uuid 4ed155bc-b1da-4117-9f92-9c952e807880

set gfxpayload=1024x768x32

menuentry "GNU/Linux, Linux 6.18.10-audio-lfs-13.0-systemd (nvidia-470xx, X11/awesome)" {
        linux /boot/vmlinuz-6.18.10-audio-lfs-13.0-systemd root=PARTUUID=c2cd0612-02 ro loglevel=3 snd_hda_intel.probe_mask=0x1FF,0x1FF snd_hda_intel.single_cmd=1 modprobe.blacklist=nouveau
        initrd /boot/microcode.img
}
# End /boot/grub/grub.cfg
