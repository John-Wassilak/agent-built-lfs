# Begin /boot/grub/grub.cfg
#
# Entry 0 (default, permanent) is the known-good nouveau boot -- never
# modified when adding entry 1. Entry 1 is for testing the NVIDIA 470.xx
# proprietary driver: same kernel/rootfs, adds modprobe.blacklist=nouveau
# so nouveau never binds to the GPU on that boot, leaving it free for the
# nvidia kernel module (loaded manually after boot, not auto-loaded).
#
# One-shot boot: `grub-editenv /boot/grub/grubenv set next_entry=1` selects
# entry 1 for exactly the next boot only -- this block clears next_entry
# as part of booting, so if that boot hangs or the nvidia driver leaves the
# system unusable, the NEXT boot (after a power cycle) automatically falls
# back to entry 0 with no manual GRUB menu interaction needed.
set default=0
set timeout=5

insmod part_msdos
insmod ext2

search --set=root --fs-uuid 4ed155bc-b1da-4117-9f92-9c952e807880

set gfxpayload=1024x768x32

load_env
if [ "${next_entry}" ]; then
        set default="${next_entry}"
        set next_entry=
        save_env next_entry
fi

menuentry "GNU/Linux, Linux 6.18.10-audio-lfs-13.0-systemd (nouveau, cryptsetup, wireguard, HDA audio)" {
        linux /boot/vmlinuz-6.18.10-audio-lfs-13.0-systemd root=PARTUUID=c2cd0612-02 ro loglevel=3 snd_hda_intel.probe_mask=0x1FF,0x1FF
        initrd /boot/microcode.img
}

menuentry "GNU/Linux, Linux 6.18.10-audio-lfs-13.0-systemd (TEST: nvidia-470xx, nouveau blacklisted)" {
        linux /boot/vmlinuz-6.18.10-audio-lfs-13.0-systemd root=PARTUUID=c2cd0612-02 ro loglevel=3 snd_hda_intel.probe_mask=0x1FF,0x1FF modprobe.blacklist=nouveau
        initrd /boot/microcode.img
}
# End /boot/grub/grub.cfg
