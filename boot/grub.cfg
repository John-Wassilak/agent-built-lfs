# Begin /boot/grub/grub.cfg
#
# NVIDIA 470.xx + X11/awesome is the permanent setup as of 2026-08-26
# (operator decision, after the Hyprland/Wayland EGLStreams dead end --
# see BUILD-REPORT.md/AWESOME-X11-PLAN.md). Entry 0 (default) blacklists
# nouveau via kernel cmdline so nvidia auto-loads cleanly. Entry 1
# (nouveau) is kept as a fallback safety net, not the primary path
# anymore -- blacklists the nvidia modules the same way, so whichever
# entry boots, only one driver ever contends for the GPU (the PCI-ID
# alias between them is a real, confirmed overlap, not just caution).
set default=0
set timeout=5

insmod part_msdos
insmod ext2

search --set=root --fs-uuid 4ed155bc-b1da-4117-9f92-9c952e807880

set gfxpayload=1024x768x32

menuentry "GNU/Linux, Linux 6.18.10-audio-lfs-13.0-systemd (nvidia-470xx, X11/awesome)" {
        linux /boot/vmlinuz-6.18.10-audio-lfs-13.0-systemd root=PARTUUID=c2cd0612-02 ro loglevel=3 snd_hda_intel.probe_mask=0x1FF,0x1FF modprobe.blacklist=nouveau
        initrd /boot/microcode.img
}

menuentry "GNU/Linux, Linux 6.18.10-audio-lfs-13.0-systemd (fallback: nouveau)" {
        linux /boot/vmlinuz-6.18.10-audio-lfs-13.0-systemd root=PARTUUID=c2cd0612-02 ro loglevel=3 snd_hda_intel.probe_mask=0x1FF,0x1FF modprobe.blacklist=nvidia,nvidia-drm,nvidia-modeset,nvidia-uvm,nvidia-peermem
        initrd /boot/microcode.img
}
# End /boot/grub/grub.cfg
