# Begin /etc/geoclue/conf.d/90-laptop.conf
#
# Geolocation backend for `laptop` (2026-09-08). Points GeoClue's [wifi] source
# at Positon instead of GeoClue's compiled-in beaconDB default.
#
# This does NOT restore the book's 90-lfs-google.conf. BLFS points this same
# setting at Google's Geolocation Service using the book's shared key, and that
# key is dead (403 PERMISSION_DENIED, billing) -- not writing that file is a
# recorded review decision in recipes/blfs-overrides.json. No Google key is
# involved here and none exists on this host.
#
# Why Positon over the beaconDB default, measured rather than assumed. Both were
# handed the same live scan off wlp4s0 (11-12 APs), on the same day:
#
#   beaconDB  35.4689,-97.5195   claimed 25000 m   actual error  16618 m
#   Positon   35.4603,-97.3387   claimed  5000 m   actual error    436 m
#
# Both answered "fallback":"ipf", meaning neither has wifi data for this street
# and both are really geolocating the IP address. The difference is entirely in
# the quality of their IP databases, and beaconDB's puts this laptop in downtown
# Oklahoma City. 436 m is not precise, but it is the difference between a
# usable answer and a useless one for everything on this box that asks where it
# is -- and the [ip] source benefits too, since its default method=ichnaea
# reuses this same url.
#
# The key below is not ours and is not secret: it is shipped in GeoClue's own
# /etc/geoclue/geoclue.conf, commented out, for exactly this use. Positon's
# condition, quoted in that file, is that distributors may only enable it where
# the service is used non-commercially -- they name Fedora, Debian and Ubuntu as
# acceptable and RHEL/SLE as not. A personal machine is well inside that. This
# file is host-scoped rather than shared partly for that reason and partly
# because which database wins is a fact about *this location*, not about the
# book: somewhere with beaconDB coverage should stay on the default.
#
# To go back to stock, delete this file. Nothing else here is non-default.
#
# Correction to the paragraph above, found immediately after switching: Positon
# DOES have wifi coverage here, and beaconDB's absence of it was never the whole
# story. GeoClue sends SSIDs along with the BSSIDs; a probe without them gets an
# IP fallback, which is why the first curl test looked identical to beaconDB's.
# With SSIDs, all six of this laptop's own APs come back known:
#
#   54:af:97:62:70:19  Awesomeness  -60  ->  35.457710,-97.321269  acc 26
#   54:af:97:62:70:18  Awesomeness  -69  ->  35.457704,-97.321214  acc 23
#   5c:a6:e6:fa:07:c0  Awesomeness  -73  ->  35.457653,-97.321263  acc 24
#   54:af:97:1d:a9:68  Awesomeness  -74  ->  35.457877,-97.321155  acc 49
#   5c:a6:e6:fa:07:c1  Awesomeness  -79  ->  35.457691,-97.321185  acc 21
#   54:af:97:1d:a9:69  Awesomeness  -83  ->  35.457683,-97.321193  acc 25
#
# Trilaterated result: 35.457720,-97.321219 at 21 m, "fallback" absent. That is
# a real wifi fix of the kind the dead Google key used to buy, keyless and free.
#
# [ip] is disabled below because it is not merely redundant now, it is harmful.
# GeoClue starts both sources and emits whichever answers first; the IP source
# returns in ~200 ms and the wifi query takes ~4.5 s, so a getCurrentPosition()
# caller takes the 5000 m IP guess and stops -- measured, Firefox's first
# callback was lat=35.4603 acc=5000 and the 21 m fix only arrived on the third
# watchPosition update. With [ip] off, the wifi fix is the only answer.
#
# Note this costs the offline/no-wifi fallback: with no APs in range there is now
# no position at all rather than a coarse one. Re-enable [ip] if that matters.

[wifi]
url=https://api.positon.xyz/v1/geolocate?key=56aba903-ae67-4f26-919b-15288b44bda9

[ip]
enable=false

# End /etc/geoclue/conf.d/90-laptop.conf
