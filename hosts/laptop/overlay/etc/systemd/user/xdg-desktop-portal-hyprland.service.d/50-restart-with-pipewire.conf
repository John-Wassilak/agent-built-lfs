# Restart the Hyprland portal backend whenever pipewire.service restarts (2026-11-18).
#
# xdg-desktop-portal-hyprland connects to PipeWire once, at startup, and does not
# reconnect. On 2026-11-18 the pipewire daemon aborted mid-meeting (a double free in
# 1.6.0) and systemd restarted it within a second. wireplumber and pipewire-pulse came
# back with it because their units carry BindsTo=pipewire.service. This unit had no
# such tie, so the backend kept running with no PipeWire connection, logged nothing, and
# every screen-share request after that hung until the frontend timed out ("Failed to
# close session implementation: Timeout was reached").
#
# PartOf= rather than BindsTo=: PartOf only forwards stop and restart jobs, so this
# backend restarts with PipeWire but never pulls PipeWire in or dies when PipeWire is
# simply not running. Drop-in dependencies add to the vendor unit's, so its own
# PartOf=graphical-session.target is kept.
#
# Host overlay, not shared: it names the Hyprland portal backend.
[Unit]
PartOf=pipewire.service
After=pipewire.service
