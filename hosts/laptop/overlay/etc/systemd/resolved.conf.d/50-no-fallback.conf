# No fallback resolvers. resolved's compiled-in FallbackDNS (Cloudflare, Google,
# Quad9) is used whenever no link has a DNS server, which sends queries around
# pi-router instead of failing. Away from home, DHCP-supplied DNS on the
# active connection still works; this only stops the silent detour. 2026-11-03.
[Resolve]
FallbackDNS=
