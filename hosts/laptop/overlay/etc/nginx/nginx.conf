# /etc/nginx/nginx.conf -- nginx configuration for `laptop`.
#
# Host file, not shared: it names this machine's docroot (/mnt/crypt/john, on this
# machine's LUKS volume) and this machine's listen address. Per CLAUDE.md's shared/host
# test, everything portable about nginx here -- the build, the nginx account, the
# systemd unit, a fail-safe stub config -- is in recipes/blfs-nginx.sh instead.
#
# Derived from the pre-LFS Gentoo config preserved at
# /mnt/server/laptop_backup/nginx/nginx.conf, reviewed 2026-09-08. What was kept, what
# was changed and what the operator was asked about is recorded below directive by
# directive; the narrative version is in hosts/laptop/BUILD-REPORT.md.
#
# ---------------------------------------------------------------------------------
# OPERATOR DECISION, 2026-09-08, made with the exposure spelled out first.
#
# The old config combined three things: `root /mnt/crypt/john` (the whole home
# directory, not the `web_server` subdirectory that looks like it was the intent),
# `autoindex on`, and `listen 0.0.0.0`. Together they publish a browsable index of
# /mnt/crypt/john, which currently contains 2023-taxes/, crt/ (fatcow.crt, gmail.crt),
# jumpbox-backup.tar.gz, resume/, wassilak-resume-2025.docx, phone_backup/, nextcloud/
# and config/.
#
# Who can reach it: the LAN cannot -- INPUT policy is DROP and recipes/blfs-iptables.sh
# opens only tcp/22 -- but the `ts-input` chain's second rule is
# `ACCEPT all -- tailscale0 * 0.0.0.0/0`, i.e. anything arriving over tailscale0 is
# accepted unconditionally. So nothing in this host's firewall stands between the tailnet
# and this docroot, and this is not a single-user tailnet: `tailscale status` lists
# ifd-container-registry, ifd-data-01, ifd-grafana and ifd-k8s-cp-01 as tagged-devices
# alongside johns-laptop.
#
# CORRECTED 2026-09-09: that paragraph originally said every node on this tailnet *can*
# browse it. Not demonstrable, and evidence points the other way -- the tailscale0 accept
# rule shows 13 packets total across four days of uptime, and an ssh from `server` to
# this box's tailnet address did not move that counter, so the packets never reached the
# kernel. Inbound was being refused inside tailscaled by the tailnet's ACL policy, not by
# anything on this host. The accurate statement is the one above: this host imposes
# nothing, and the enforcement was living somewhere a web console controls. As of
# 2026-09-09 `tailscale set --shields-up` moves that refusal onto this device.
#
# The alternatives offered were a docroot of /mnt/crypt/john/web_server (media only), or
# /srv/www; and a listen address of the tailscale IP only, or 127.0.0.1 only. The
# operator chose to reproduce the old behaviour: docroot /mnt/crypt/john, listen
# 0.0.0.0:80. That decision is recorded here rather than silently narrowed, and the
# firewall was NOT opened for tcp/80 at the time -- so LAN reachability depended on an
# iptables change nobody had made.
#
# AMENDED 2026-09-09, operator request: one such change has now been made, and it is
# narrower than the LAN. hosts/laptop/blfs-overrides.json's blfs-iptables block 2 adds
# `iptables -A INPUT -i wg+ -s 10.0.0.0/24 -p tcp --dport 80 -m conntrack --ctstate NEW
# -j ACCEPT` to /etc/systemd/scripts/iptables, so tcp/80 is reachable from the home
# router's WireGuard subnet (wg0 split tunnel, wg1 full tunnel) in addition to the
# tailnet. Verified end to end: curl from 10.0.0.1 over wg0 returns 200, curl from the
# same host to this machine's LAN address 192.168.0.210 still times out. Everyone who
# holds a peer key on that router can now browse this docroot -- and unlike the tailnet
# path, that one is demonstrated working rather than assumed, which makes WireGuard the
# real exposure here.
# ---------------------------------------------------------------------------------
#
# KNOWN OPERATIONAL LIMITATION: /mnt/crypt is not in /etc/fstab. It is the LUKS volume
# (/dev/mapper/cryptroot) unlocked and mounted by hand. nginx starts fine without it --
# `root` is resolved per request, not at startup -- but until it is mounted, every
# request under / returns 404 and the error log says "No such file or directory". If
# this docroot should survive a reboot unattended, /mnt/crypt needs an fstab entry and a
# crypttab entry, which is a separate decision (it means either a keyfile on the
# unencrypted root or a boot-time passphrase prompt).

# The account recipes/blfs-nginx.sh creates: system uid, /bin/false shell, home
# /var/lib/nginx. Compiled in via --user/--group as well; stated here because it is
# load-bearing and worth seeing in the file that governs the running server.
user  nginx nginx;

# CHANGED from `worker_processes 1`. This CPU is an i7-6600U: 2 cores, 4 threads. One
# worker serialises every request through a single event loop, which on a docroot that
# is 836 .mp4 files means one client's range requests queue behind another's. `auto`
# resolves to the online CPU count.
worker_processes  auto;

# Matches LimitNOFILE=16384 in nginx.service. Without it nginx inherits the limit but
# caps its own accounting at the compile-time default and logs
# "getrlimit(RLIMIT_NOFILE) ... worker_connections exceed open file resource limit".
worker_rlimit_nofile  16384;

# CHANGED from `error_log /var/log/nginx/error_log info`. Two changes: the filename gets
# its extension back (the extension-less `error_log`/`access_log` names were Gentoo's
# convention, and this system's logrotate and lfsmaint expectations are the upstream
# ones), and the level drops from `info` to `warn`, which is nginx's own default.
# `info` on a file server logs a line per request phase and buries the warnings that
# matter under the ones that do not.
error_log  /var/log/nginx/error.log warn;

# Matches PIDFile= in nginx.service.
pid        /run/nginx.pid;

events {
    worker_connections  1024;
    # Explicit rather than left to autodetection. epoll is what nginx picks on Linux
    # anyway; naming it means a build on a kernel without it fails at startup instead
    # of silently falling back to select().
    use                 epoll;
}

http {
    # CHANGED from `include /etc/nginx/mime.types.nginx`. That file was Gentoo's
    # 1079-entry table from its app-misc/mime-types package, which does not exist on
    # this system. This is nginx's own 98-entry table, installed by `make install`.
    #
    # The switch loses coverage that this docroot actually needs, so the gap is closed
    # explicitly in the `types` block below rather than left to be discovered as a
    # browser download prompt. Checked by inventory, not guessed:
    # `find /mnt/crypt/john -maxdepth 3 -type f` finds 836 mp4, 448 jpg, 168 webm,
    # 89 mp3, 25 pdf and 13 mkv -- all covered by the upstream table except mkv.
    include       /etc/nginx/mime.types;

    # Extensions present in this docroot that nginx's own mime.types does not carry.
    # Without these they are served as application/octet-stream, which makes a browser
    # download the file instead of playing or displaying it.
    types {
        # 13 .mkv files in the docroot. Gentoo's table had video/x-matroska; nginx's
        # does not carry Matroska at all.
        video/x-matroska  mkv;
        audio/x-matroska  mka;
        # 2 .m4b audiobooks at the top level of the docroot. m4b is MPEG-4 audio with
        # chapters; audio/mp4 is what makes a browser treat it as playable audio
        # rather than a download. nginx's table has m4a but not m4b.
        audio/mp4         m4b;
        # Plain-text sources that are worth reading in a browser rather than
        # downloading: 72 .org, 44 .md, 16 .conf, 6 .log in the inventory above.
        text/plain        md org conf log;
    }

    default_type  application/octet-stream;

    # Kept from the old config. Not strictly needed by the 98-entry upstream table
    # (which fits the 1024 default), but harmless and correct if the table ever grows.
    types_hash_max_size  4096;

    # ADDED. autoindex renders filenames as raw bytes with the charset nginx declares,
    # and this docroot's filenames are UTF-8 with brackets, apostrophes and non-ASCII
    # characters. Without a declared charset the browser guesses, and the index page
    # shows mojibake for exactly the files whose names came from YouTube titles.
    charset  utf-8;

    # ADDED. The old config advertised "nginx/<version>" in every Server: header and on
    # every error page. That is a free version-and-CVE lookup for anything scanning the
    # tailnet this now listens on.
    server_tokens  off;

    # Kept verbatim from the old config, including the $gzip_ratio field.
    log_format main
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $bytes_sent '
        '"$http_referer" "$http_user_agent" '
        '"$gzip_ratio"';

    # CHANGED from 10m each for the two request-reading timeouts; send_timeout kept
    # long. The old 10-minute client_header_timeout/client_body_timeout means a client
    # can hold a worker connection open for ten minutes while dribbling one byte at a
    # time -- the slowloris shape -- and now that this listens on 0.0.0.0 rather than
    # being a single-user experiment, that matters. 60s is generous for a real client
    # sending a request.
    #
    # send_timeout stays at 10m on purpose: it bounds the gap between two successful
    # writes to a client that is *receiving*, and a browser buffering a 425 MB mp4 over
    # a slow tailnet link legitimately pauses for minutes between reads.
    client_header_timeout  60s;
    client_body_timeout    60s;
    send_timeout           10m;

    # REMOVED from the old config, deliberately, each for its own reason:
    #
    #   connection_pool_size 256        Both are per-connection/per-request memory
    #   request_pool_size 4k            allocator sizing knobs from the 0.x-era tuning
    #                                   guides. nginx's own docs now say there is
    #                                   "almost no need to change" them, and the
    #                                   defaults are platform-tuned (256/4k on 64-bit
    #                                   is what these lines set anyway -- they were
    #                                   restating the default).
    #
    #   client_header_buffer_size 1k    The default already is 1k. Restating it is
    #                                   harmless but it is the pair to the next line.
    #
    #   large_client_header_buffers 4 2k
    #                                   This one was a live bug, not just noise: the
    #                                   default is `4 8k` and the old config shrank it
    #                                   to 2k. A request line longer than the buffer
    #                                   gets 414, and this docroot's filenames run past
    #                                   130 characters before URL-encoding, which
    #                                   inflates every space and bracket to three bytes.
    #                                   Restored to the default by removing the line.
    #
    #   output_buffers 1 32k            Default is `2 32k`. The old value halves the
    #   postpone_output 1460            read-ahead for exactly the large-file reads this
    #                                   docroot is made of, and postpone_output was
    #                                   pinned to one ethernet MSS, which predates TSO
    #                                   and the tcp_nopush setting below doing the same
    #                                   job in the kernel.
    #
    #   ignore_invalid_headers on       Already the default.

    # Kept from the old config, and correct here: this docroot is 836 mp4, 168 webm,
    # 448 jpg and 89 mp3 -- all already-compressed formats, where gzip burns CPU to
    # make the payload marginally larger. The log_format above still carries
    # $gzip_ratio, which will read "-" for every request; harmless, and left in place
    # so the format is byte-identical to the old one.
    gzip  off;

    # Kept from the old config.
    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    # ADDED, and this is the substantive performance change. sendfile() on its own is a
    # blocking read: a worker calling it on a 425 MB mp4 that is not in page cache
    # stalls its whole event loop, and every other client on that worker waits. The
    # nginx recipe compiles --with-threads and --with-file-aio precisely so this line
    # is available; it moves the read into a thread pool and the worker keeps serving.
    #
    # sendfile_max_chunk bounds how much one sendfile() call may transfer before nginx
    # returns to the event loop, so a single fast client downloading a large file cannot
    # monopolise a worker. 2m is upstream's own recommended value for this pairing.
    aio                 threads;
    sendfile_max_chunk  2m;

    # CHANGED from `keepalive_timeout 75 20`. The first value is the server-side
    # timeout and is kept. The second emitted a `Keep-Alive: timeout=20` response
    # header, which nginx's docs note is for old MSIE and is ignored by every current
    # browser -- and setting it 55s *lower* than the real timeout tells clients to give
    # up a connection the server would have honoured.
    keepalive_timeout  75;

    index  index.html;

    server {
        # OPERATOR DECISION, see the header. All interfaces, port 80. Reachable over
        # tailscale0 by every node on the tailnet; not reachable from the LAN unless
        # tcp/80 is added to recipes/blfs-iptables.sh, which it has not been.
        listen       0.0.0.0:80;
        server_name  localhost;

        access_log  /var/log/nginx/localhost.access.log main;
        error_log   /var/log/nginx/localhost.error.log warn;

        # OPERATOR DECISION, see the header. The whole home directory, browsable.
        # /mnt/crypt/john/web_server was offered instead and declined.
        root      /mnt/crypt/john;
        autoindex on;

        # ADDED. autoindex's default output is bytes-as-integers and dates in a fixed
        # format; these make the listing readable for a tree whose files run to
        # hundreds of megabytes. Both are display-only.
        autoindex_exact_size off;
        autoindex_localtime  on;

        # DISABLED, preserved verbatim so it can be switched back on in one edit.
        #
        # The old config proxied /pi to 127.0.0.1:8080. Nothing listens on 8080 on this
        # machine -- checked with `ss -ltn` on 2026-09-08, no socket bound there, and no
        # unit in this build provides one -- so left enabled it would answer every
        # request to /pi with 502 and write a "connect() failed (111: Connection
        # refused)" line to the error log. Whatever served it on the old Gentoo install
        # was not carried into this build.
        #
        # To restore: start the 8080 service, uncomment, `nginx -t`, `systemctl reload
        # nginx`.
        #
        # location /pi {
        #     proxy_pass  http://127.0.0.1:8080;
        #
        #     proxy_set_header  Host             $host;
        #     proxy_set_header  X-Real-IP        $remote_addr;
        #     proxy_set_header  X-Forwarded-For  $remote_addr;
        #
        #     client_max_body_size     10m;
        #     client_body_buffer_size  128k;
        #
        #     proxy_connect_timeout  90;
        #     proxy_send_timeout     90;
        #     proxy_read_timeout     90;
        #
        #     proxy_buffer_size           4k;
        #     proxy_buffers               4 32k;
        #     proxy_busy_buffers_size     64k;
        #     proxy_temp_file_write_size  64k;
        #
        #     expires  off;
        # }
    }

    # Kept from the old config. No *_vhost.conf file exists on this machine or in the
    # Gentoo backup -- nginx accepts an include glob that matches nothing -- so this is
    # an extension point, not a dependency.
    include  /etc/nginx/*_vhost.conf;
}
