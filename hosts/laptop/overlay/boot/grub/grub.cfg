set default=0
set timeout=5

insmod part_msdos
insmod ext2

search --set=root --fs-uuid 313701ec-1a32-4bea-9688-6095e8370047

# Two entries, newest first. History of earlier kernels is in hosts/laptop/BUILD-REPORT.md.
#
# 0: the kernel to run. 6.18.49 with the container options (2026-10-01) plus TPM 2.0
#    (tpm_crb), UHID and the 2026-10-13 unbound-hardware sweep (AES-NI, RMI4 touchpad,
#    PCH thermal, intel_idle, iTCO watchdog, KVM, SD reader). Two parameters, both
#    tested 2026-10-13 from a temporary entry before moving here:
#    - intel_iommu=off: the firmware TPM reads its CRB control area (0xd7fff000) by DMA
#      from 00:12.4, a requester ID not on the PCI bus, and with DMA remapping on the
#      IOMMU blocks it and tpm_crb's probe times out (-62). The kernel config still has
#      INTEL_IOMMU_DEFAULT_ON; this turns it back off. Interrupt remapping stays on.
#    - psmouse.synaptics_intertouch=1: the touchpad's PNP ID LEN0058 is not in
#      synaptics.c's smbus_pnp_ids[], so without this it stays on PS/2 instead of
#      rmi_smbus. psmouse is built in, so it has to be on this line.
menuentry "LFS 13.0 laptop -- 6.18.49 (current)" {
    linux /boot/vmlinuz-6.18.49-lfs-13.0-systemd root=PARTUUID=f1183155-01 rootwait intel_iommu=off psmouse.synaptics_intertouch=1
    initrd /boot/microcode.img
}

# 1: the one backup. The 6.18.49 Docker kernel that ran 2026-10-01 to 2026-10-13. Same
#    version string, so it boots against /lib/modules/6.18.49, the newer tree, and this
#    time that does NOT work as is: the newer config has PREEMPT_NOTIFIERS (from KVM),
#    which adds a field to task_struct, and MODVERSIONS is off, so its modules would
#    load into this kernel with a different struct layout. Swap its own tree in first.
#    At the grub menu, press e on this entry and append init=/bin/bash to the linux line
#    (no udev, so no modules load), then:
#
#        mount -o remount,rw /
#        mv /lib/modules/6.18.49 /lib/modules/6.18.49.tpm
#        mv /lib/modules/6.18.49.preTPM /lib/modules/6.18.49
#        sync; reboot -f
#
#    and pick this entry again without the edit.
menuentry "LFS 13.0 laptop -- 6.18.49 backup, pre-TPM (2026-10-01)" {
    linux /boot/vmlinuz-6.18.49-lfs-13.0-systemd.preTPM root=PARTUUID=f1183155-01 rootwait
    initrd /boot/microcode.img
}
