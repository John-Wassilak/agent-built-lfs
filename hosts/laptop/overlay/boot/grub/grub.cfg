set default=0
set timeout=5

insmod part_msdos
insmod ext2

search --set=root --fs-uuid 313701ec-1a32-4bea-9688-6095e8370047

# Two entries, newest first. History of earlier kernels is in hosts/laptop/BUILD-REPORT.md.
#
# 0: the kernel to run. 6.18.49 with the container options from bin/kernel-config-base.sh
#    (built 2026-10-01 for Docker).
menuentry "LFS 13.0 laptop -- 6.18.49 (current)" {
    linux /boot/vmlinuz-6.18.49-lfs-13.0-systemd root=PARTUUID=f1183155-01 rootwait
    initrd /boot/microcode.img
}

# 1: the one backup. The 6.18.49 kernel that ran 2026-09-05 to 2026-10-01, before the
#    Docker config rebuild. Same version string, so it boots against /lib/modules/6.18.49,
#    the newer tree. That rebuild only added options (29 symbols, no set value changed),
#    so the newer modules are a superset and this usually works as is. If it misbehaves,
#    swap its own tree in first:
#
#        mv /lib/modules/6.18.49 /lib/modules/6.18.49.docker
#        mv /lib/modules/6.18.49.preDOCKER /lib/modules/6.18.49
menuentry "LFS 13.0 laptop -- 6.18.49 backup, pre-Docker (2026-09-05)" {
    linux /boot/vmlinuz-6.18.49-lfs-13.0-systemd.preDOCKER root=PARTUUID=f1183155-01 rootwait
    initrd /boot/microcode.img
}
