set default=0
set timeout=5

insmod part_msdos
insmod ext2

search --set=root --fs-uuid 313701ec-1a32-4bea-9688-6095e8370047

menuentry "LFS 13.0 systemd (laptop)" {
    linux /boot/vmlinuz-6.18.10-lfs-13.0-systemd root=PARTUUID=f1183155-01 rootwait
    initrd /boot/microcode.img
}

# Fallbacks. Every kernel here is version 6.18.10 -- the version string never changes
# between these rebuilds -- so they all share one /lib/modules/6.18.10, and each rebuild's
# `make modules_install` overwrites it in place. A fallback entry therefore boots an OLD
# kernel against the NEWEST modules unless the matching tree is restored first:
#
#     mv /lib/modules/6.18.10 /lib/modules/6.18.10.new
#     mv /lib/modules/6.18.10.preUVC /lib/modules/6.18.10
#
# In practice each rebuild here only ADDED options, so the newer modules are a superset
# and an old kernel usually boots fine without that -- but a config change that alters
# module ABI would not be caught by vermagic, since the version is identical. Restore the
# tree if a fallback misbehaves.

menuentry "LFS 13.0 systemd (laptop) -- pre-thermald-sensors fallback (2026-09-04)" {
    linux /boot/vmlinuz-6.18.10-lfs-13.0-systemd.preTHERMAL root=PARTUUID=f1183155-01 rootwait
    initrd /boot/microcode.img
}

menuentry "LFS 13.0 systemd (laptop) -- pre-webcam/USER_NS fallback (2026-09-04)" {
    linux /boot/vmlinuz-6.18.10-lfs-13.0-systemd.preUVC root=PARTUUID=f1183155-01 rootwait
    initrd /boot/microcode.img
}

menuentry "LFS 13.0 systemd (laptop) -- pre-Bluetooth fallback (2026-09-03)" {
    linux /boot/vmlinuz-6.18.10-lfs-13.0-systemd.preBT root=PARTUUID=f1183155-01 rootwait
    initrd /boot/microcode.img
}
