# 2026-09-05: /lfs-audit found sa-13.0-066/098 (Critical) + sa-13.0-122 (High) against
# 6.18.10, the LFS 13.0 book's own pin. Unlike every kernel rebuild below, this is a
# genuine point-release bump (6.18.10 -> 6.18.49, kernel.org's own latest in the same
# longterm branch, confirmed via kernel.org directly), not a config-only rebuild -- there
# is no existing project mechanism to override an LFS chapter step's book-pinned
# version (bin/extract-recipes.py parses the book's own HTML for both the recipe text
# and plan.json's tarball field), so this was built by hand: same source
# (kernel-config.sh, unchanged) and same `make`/`make modules_install` the book/recipe
# already use, just against linux-6.18.49's tree instead of a chroot/native lfsbuild
# step. That also means it gets its own real /lib/modules/6.18.49 tree, not an in-place
# overwrite of 6.18.10's -- cleaner than the vermagic-sharing caveat the fallback block
# below already warns about. Booted 2026-09-05 and confirmed clean (modules, iwlwifi/
# i915/Bluetooth firmware, no failed units) -- `default` promoted from 0 to 1, this is
# now the entry that boots automatically. 6.18.10 (entry 0) stays available and untouched.
menuentry "LFS 13.0 systemd (laptop) -- 6.18.49 (2026-09-05, sa-13.0-066/098/122)" {
    linux /boot/vmlinuz-6.18.49-lfs-13.0-systemd root=PARTUUID=f1183155-01 rootwait
    initrd /boot/microcode.img
}

# Fallbacks. Every kernel here is version 6.18.10 -- the version string never changes
# between these rebuilds -- so they all share one /lib/modules/6.18.10, and each rebuild's
# `make modules_install` overwrites it in place. A fallback entry therefore boots an OLD
# kernel against the NEWEST modules unless the matching tree is restored first:
#
#     mv /lib/modules/6.18.10 /lib/modules/6.18.10.new
#     mv /lib/modules/6.18.10.preUVC /lib/modules/6.18.10
#
# In practice each rebuild here only ADDED options, so the newer modules are a superset
# and an old kernel usually boots fine without that -- but a config change that alters
# module ABI would not be caught by vermagic, since the version is identical. Restore the
# tree if a fallback misbehaves.

menuentry "LFS 13.0 systemd (laptop) -- pre-thermald-sensors fallback (2026-09-04)" {
    linux /boot/vmlinuz-6.18.10-lfs-13.0-systemd.preTHERMAL root=PARTUUID=f1183155-01 rootwait
    initrd /boot/microcode.img
}

menuentry "LFS 13.0 systemd (laptop) -- pre-webcam/USER_NS fallback (2026-09-04)" {
    linux /boot/vmlinuz-6.18.10-lfs-13.0-systemd.preUVC root=PARTUUID=f1183155-01 rootwait
