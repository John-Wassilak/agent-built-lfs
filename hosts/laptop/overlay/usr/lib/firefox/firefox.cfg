// Firefox autoconfig for laptop. The first line of this file is ALWAYS
// skipped by the parser -- it must stay a comment or the next line is lost.
//
// Geolocation on this host is answered by GeoClue, the same way Gentoo,
// Fedora, NixOS, Guix and Void answer it. Firefox needs no pref to use it --
// geo.provider.use_geoclue defaults to true and libxul carries the
// org.freedesktop.GeoClue2 client -- so what remains here is the record of why
// this file no longer overrides anything, kept because the wrong answer is
// cheap to re-derive and expensive to debug.
//
// How this got here, in the order it was found (2026-09-08):
//
//  1. BLFS's firefox mozconfig bakes in the book's shared Google Location
//     Service key (verified present in this build, in omni.ja's
//     modules/AppConstants.sys.mjs). That key is dead -- Google answers it
//     with "403 PERMISSION_DENIED: You must enable Billing on the Google
//     Cloud Project" -- so every request failed with POSITION_UNAVAILABLE.
//     BLFS's GeoClue page spends the same dead key a second time, so building
//     GeoClue was not the fix it looked like either.
//  2. As a stopgap, this file pointed geo.provider.network.url at a data: URL
//     holding a literal position and set geo.provider.use_geoclue false.
//     That worked and needed no network, but it was Firefox-only: nothing else
//     on the system could see a location, and the answer came from a browser
//     pref rather than a location service.
//  3. GeoClue-2.8.0 built 2026-09-08 (seq 321-324, with libsoup3 and its deps).
//     Its own compile-time default for the [wifi] url is already
//     https://api.beacondb.net/v1/geolocate -- keyless, public-domain, the
//     MLS successor every distro switched to -- so the fix was to NOT write
//     the book's Google config at all. That is a recorded review decision in
//     recipes/blfs-overrides.json, not an edit to the generated recipe.
//
//  4. beaconDB turned out to have no wifi data for this address -- handed the
//     12 APs this laptop can see it matched none and answered from its IP
//     fallback, lat=35.4689 lon=-97.5195 acc=25000, 16.6 km away in downtown
//     Oklahoma City. Positon, one of the three alternatives GeoClue's own
//     /etc/geoclue/geoclue.conf documents (BLFS mentions none of them), knows
//     all six of this laptop's APs and trilaterates them to 21 m. The [wifi]
//     source is repointed at it in hosts/laptop/overlay/etc/geoclue/conf.d/
//     90-laptop.conf, with that file carrying the measurements. Still keyless
//     as far as this repo is concerned -- the key in it is the one upstream
//     ships for non-commercial use, not ours.
//
// So the position is autodetected, the way it is on any other distro: no pref
// here, no /etc/geolocation, no hardcoded answer anywhere. Measured after the
// switch -- Firefox from a fresh profile, GEO_OK lat=35.457717 lon=-97.321218
// acc=21 in 3.3 s. The 3.3 s is the wifi query; [ip] is disabled in that same
// conf.d file because GeoClue does NOT rank sources and hand out the best, it
// hands out whichever answers first and updates later, and the ~200 ms IP guess
// (5000 m) was what getCurrentPosition() kept.
//
// A GeoClue static source (/etc/geolocation, four numbers, geoclue(5)) was built
// and measured before any of this and removed: it is a hardcoded answer and no
// distro ships one. hosts/laptop/BUILD-REPORT.md carries its exact contents, and
// the note that turning it back on means disabling [wifi] and [ip] alongside it.
//
// Deliberately empty of geo prefs. Two that used to be here and must NOT come
// back without re-reading the above:
//   geo.provider.network.url    -- the data: URL stopgap from step 2.
//   geo.provider.use_geoclue    -- was false while GeoClue was absent.
// Setting either one again silently takes this host back off the standard path.

// ---------------------------------------------------------------------------
// Graphics acceleration, forced rather than probed (2026-09-11).
//
// So this file is no longer pref-free -- the "deliberately empty" note above
// is about geolocation prefs specifically and still holds.
//
// Firefox decides whether to use the GPU by forking /usr/lib/firefox/glxtest
// at startup and reading its report back over a pipe. If that child dies, the
// answer is "no GPU" and Firefox runs the whole session on software: software
// WebRender, and WebGL contexts that websites see as unaccelerated or absent.
// It says nothing in the UI and writes no pref, so the only way to see it is
// that no Mesa library is mapped into any Firefox process.
//
// That happened here. Three glxtest SIGSEGVs are on file (2026-09-08 16:16:45,
// 2026-09-08 16:18:50, 2026-09-10 15:39:10), each in a Firefox launched from a
// link in Slack, and the third one left a browser running for nine hours with
// no GPU -- found when a WebGL site refused to load. The fault is a read of
// 0x143 at the entry of pthread_mutex_lock: a garbage mutex pointer in the
// forked child. Not a driver fault -- glxtest run by hand succeeds 200/200 and
// reports iris / HD 520 / Mesa 25.3.5, and libpci is installed so the PCI path
// is not the stunted one either.
//
// These three prefs take the probe out of the decision. They are safe HERE
// because the GPU was measured rather than assumed:
//   - GLX on this Xwayland display: direct, hardware, GL 4.6 (Mesa 25.3.5)
//   - EGL on the X11 platform:      hardware, GLES 3.2, dma_buf import present
//   - a freshly started Firefox:    WebGL 1 and 2, hardware, readback correct,
//                                   failIfMajorPerformanceCaveat:true passing
// On a host whose GPU is genuinely blocklisted these would force a known-bad
// path. Repeat the measurement before copying them anywhere -- which is why
// this lives in the host overlay and not the shared one.
//
// Note this file is applied by hand at deploy time (see BOOTSTRAP.md), so
// editing it here does not change a running system. The same three prefs were
// written to this host's live profile user.js on 2026-09-11 to take effect.
pref("gfx.webrender.all", true);
pref("webgl.force-enabled", true);
pref("gfx.x11-egl.force-enabled", true);

// ---------------------------------------------------------------------------
// Video codec preference, from measured hardware capability (2026-09-11).
//
// Enumerated directly against /dev/dri/renderD128 through libva (iHD 25.3.4),
// not taken from a spec sheet:
//   decode: MPEG2, H.264 Baseline/Main/High, VC1, JPEG, VP8, HEVC Main 8-bit
//   encode: MPEG2, H.264 (+ low-power), VP8, HEVC Main, JPEG
// Absent: VP9, AV1, HEVC Main10. Skylake GT2 has no VP9 or AV1 decode block, so
// those streams land on two cores in software.
//
// Measured, same source, 1280x720@30, ~3 Mbps, total CPU across the whole
// Firefox process tree. Hardware decode was confirmed structurally, by the RDD
// process holding an fd on /dev/dri/renderD128, not inferred from the CPU drop:
//   H.264  28.9%  hardware
//   VP9    63.9%  software  (2.2x)
//   AV1    73.8%  software  (2.6x)
//
// These push adaptive-streaming sites onto MP4/H.264+AAC. Verified with
// MediaSource.isTypeSupported: webm/vp9, webm/vp8, webm/opus and every AV1
// variant go false; mp4/h264, mp4/hevc, mp4/aac stay true. Plain
// <video src="...webm"> is untouched -- VP9/VP8/Opus still play through the
// element path. media.webm.enabled is deliberately left alone.
//
// Host-specific twice over: the codec list is this GPU's, and the usual
// objection (YouTube caps H.264 at 1080p) is void only because both displays
// here are 1360x768 and 1440x900. A host with a 4K panel or a GPU with a VP9
// block should not carry these.
//
// gfx.canvas.accelerated was tested and deliberately NOT set: a canvas2d
// benchmark measured 19.0% CPU at the shipped default against 20.1% forced on,
// so it buys nothing here and the default stands.
pref("media.av1.enabled", false);
pref("media.mediasource.webm.enabled", false);
