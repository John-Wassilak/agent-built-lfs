// Firefox autoconfig for laptop. The first line of this file is ALWAYS
// skipped by the parser -- it must stay a comment or the next line is lost.
//
// Geolocation on this host is answered from a hardcoded position, not from
// any online service. Why, in the order it was found (2026-09-08):
//
//  1. BLFS's firefox mozconfig bakes in the book's shared Google Location
//     Service key (verified present in this build, in omni.ja's
//     modules/AppConstants.sys.mjs). That key is dead -- Google answers it
//     with "403 PERMISSION_DENIED: You must enable Billing on the Google
//     Cloud Project" -- so every request failed with POSITION_UNAVAILABLE.
//  2. Repointed at beaconDB, the keyless successor to the retired Mozilla
//     Location Service. It answered, but only ever with its IP fallback
//     ("fallback":"ipf", accuracy 25000) -- including when handed 11 real
//     APs scanned from this laptop, so beaconDB has no wifi coverage in this
//     area at all. City-scale and slow; the operator reported sites spinning
//     and giving up.
//  3. Building GeoClue-2.8.0 was therefore pointless as an accuracy fix: it
//     would query the same backend for the same answer. BLFS's own GeoClue
//     page configures its [wifi] source with the same dead Google key.
//
// What is left is either a Google Cloud project with billing enabled, or
// this: state the position outright. Firefox will fetch any URL named by
// geo.provider.network.url, including a data: URL, and parses the response
// with the same JSON reader it uses for a real provider -- so a literal
// answer needs no network, no D-Bus, no third party, and returns instantly.
//
// The coordinates are the operator's, supplied 2026-09-08, rounded to six
// decimals (~0.1 m). The full 15 decimals they arrived with are a tell: no
// real position source emits sub-micrometre precision, and a site validating
// the shape of the answer can notice. The accuracy
// field is a claim, not a measurement: 30 m is what a GPS fix would look
// like, which is what a site expecting a phone-grade position wants to see.
// Edit both freely -- nothing here is derived from anything else.
//
// use_geoclue off because there is now nothing for it to find: the probe of
// org.freedesktop.GeoClue2 fails on every geolocation request and only adds
// latency. If GeoClue is ever built, drop this line first.
//
// defaultPref, not lockPref: these are better defaults, not policy, and stay
// overridable per profile in about:config.
defaultPref('geo.provider.network.url', 'data:application/json,{"location": {"lat": 35.461479, "lng": -97.320247}, "accuracy": 30.0}');
defaultPref('geo.provider.use_geoclue', false);
