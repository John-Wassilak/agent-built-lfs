# hwdec=vdpau-copy: real hardware H.264 decode via the NVIDIA
# proprietary driver, confirmed working end-to-end with this exact
# setting (`mpv -v` log: "Using hardware decoding (vdpau-copy)",
# clean playback, no errors) -- see BUILD-REPORT.md's Phase 4 testing.
# Superseded the nouveau/VAAPI path this was previously set to avoid:
# VAAPI on nouveau has a confirmed, unfixed upstream crash bug (Mesa
# gitlab issue #14058) that VDPAU on the NVIDIA driver doesn't share --
# separate driver stack entirely, not the same code.
#
# vdpau-copy (not plain vdpau) deliberately: works with the standard
# vo=gpu already set below. Plain hwdec=vdpau requires the legacy
# vo=vdpau, which mpv's own log flags as a low-quality compatibility
# path with known OSD/scaling/screenshot issues. Also tried vo=gpu-next
# (mpv's own suggested modern alternative) -- it silently fell back to
# software decode (an hwdec/libplacebo interop gap not chased down
# further, since vdpau-copy+vo=gpu already works cleanly).
hwdec=vdpau-copy
vo=gpu
ytdl-format="137+140/bestvideo[vcodec!~='(vp0?9|av0?1)'][id!=299]+bestaudio/best"
