# Hand-simplified from nvidia-xconfig's output -- the generated
# InputDevice sections referenced the legacy xf86-input-mouse/-keyboard
# drivers, which this project never built (xf86-input-libinput is the
# only input driver installed, matching modern practice). Stripped
# those sections and the ServerLayout's references to them; Xorg's
# AutoAddDevices default (unset here = on) picks up input devices via
# udev + the libinput driver automatically, using the config snippet
# xf86-input-libinput's own install already placed at
# /usr/share/X11/xorg.conf.d/40-libinput.conf.
Section "ServerLayout"
    Identifier     "Layout0"
    Screen      0  "Screen0"
EndSection

Section "Files"
EndSection

Section "Monitor"
    Identifier     "Monitor0"
    VendorName     "Unknown"
    ModelName      "Unknown"
    Option         "DPMS"
EndSection

Section "Device"
    Identifier     "Device0"
    Driver         "nvidia"
    VendorName     "NVIDIA Corporation"
EndSection

Section "Screen"
    Identifier     "Screen0"
    Device         "Device0"
    Monitor        "Monitor0"
    DefaultDepth    24
    SubSection     "Display"
        Depth       24
    EndSubSection
EndSection
