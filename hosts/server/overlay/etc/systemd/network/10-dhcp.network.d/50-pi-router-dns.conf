# DNS comes from pi-router (192.168.1.30) and nowhere else. The LAN's DHCP offers
# 192.168.1.30 and 192.168.1.1, and resolved fails over to .1 on its own, so DHCP's
# list is ignored rather than trusted to stay in order. A drop-in, so the shared
# 10-dhcp.network from the LFS ch09 recipe stays as the book wrote it. 2026-11-03.
[Network]
DNS=192.168.1.30

[DHCPv4]
UseDNS=no

[IPv6AcceptRA]
UseDNS=no
