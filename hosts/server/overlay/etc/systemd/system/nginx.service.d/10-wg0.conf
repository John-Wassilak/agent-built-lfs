# nginx.service drop-in for `server` (2026-09-24).
#
# /etc/nginx/nginx.conf binds 10.0.0.4, wg0's address, and nginx will not start if a
# listen address is missing. The shared unit's After=network.target does not wait
# for wg-quick, so start after it here.
#
# After= and Wants=, not Requires=: a failed tunnel should cost only the wg0 bind,
# and with Requires= a stop or restart of wg-quick@wg0 would also stop nginx. If wg0 is
# down at start, nginx fails on the bind and Restart=on-failure keeps retrying every 5s.
[Unit]
After=wg-quick@wg0.service
Wants=wg-quick@wg0.service
