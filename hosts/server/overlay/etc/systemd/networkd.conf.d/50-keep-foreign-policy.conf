# agent-built-lfs -- keep hand-managed routing policy rules and routes
# Copyright (c) 2026 John Wassilak
#
# By default systemd-networkd removes every routing policy rule and route it did not add
# itself (except protocol kernel) whenever it reconfigures a link. That silently deleted
# the uid policy rules vm-wg1-route installs for the slirp guests, and the `unreachable
# default` in table 51, the first time any link reconfigured after boot -- dropping the
# Windows guest's egress back onto enp6s0 without a trace (found 2026-10-29). wg-quick's
# own wg1 default route survived only because its PostUp re-adds it.
#
# These rules are managed by hand (vm-wg1-route, wg1.conf PostUp), not by any .network
# file -- no .network here defines [RoutingPolicyRule] -- so turning the pruning off costs
# nothing and stops the leak. networkd reads this at startup; it needs a restart, not a
# reload, to take effect.

[Network]
ManageForeignRoutingPolicyRules=no
ManageForeignRoutes=no
