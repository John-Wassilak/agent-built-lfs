# No LLMNR or mDNS. resolved enables both by default and listens on 5355 and 5353 on
# every interface. Nothing on this machine resolves or announces names that way: hosts
# come from /etc/hosts and pi-router's DNS. The firewall already dropped both inbound;
# this removes the listeners and stops the outbound multicast queries. A global "no"
# overrides any per-link setting NetworkManager or networkd pushes. 2026-11-03.
[Resolve]
LLMNR=no
MulticastDNS=no
