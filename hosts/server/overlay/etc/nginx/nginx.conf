# /etc/nginx/nginx.conf -- nginx configuration for `server`.
#
# Host file, not shared: it names this machine's WireGuard address. Everything portable
# about nginx -- the build, the nginx account, the systemd unit, the fail-safe stub
# config -- is in recipes/blfs-nginx.sh.
#
# OPERATOR DECISIONS, 2026-09-24: serve the stub for now (no docroot chosen yet), and
# expose it to "wireguard and loopback only".
#
# This is the recipe's stub with one change: the listen addresses. Each is bound by
# address, not `listen 80`, because a wildcard bind would also answer on tailscale0,
# and tailscaled's ts-input chain, which runs first in INPUT, accepts everything
# arriving on that interface. The iptables rules cannot close the port there; only
# the bind can. enp6s0 is closed by both: no bind, and INPUT policy DROP with no
# tcp/80 rule for it (the blfs-iptables host override accepts tcp/80 on wg0 only).
#
# 10.0.0.4 exists only once wg-quick@wg0 has brought wg0 up, and nginx refuses to start
# if any listen address fails to bind. nginx.service.d/10-wg0.conf orders nginx after
# that unit for this reason.
#
# When a real docroot or proxy target is chosen, it replaces the `server` block below.

user  nginx nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    # Do not advertise the running version in Server: or on error pages.
    server_tokens off;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;

    access_log    /var/log/nginx/access.log;

    server {
        listen       127.0.0.1:80;
        listen       [::1]:80;
        listen       10.0.0.4:80;
        server_name  localhost;
        root         /srv/www/nginx;
        index        index.html;
    }
}
