# Begin /boot/grub/grub.cfg
#
# NVIDIA 470.xx + X11/awesome is the permanent setup as of 2026-08-26
# (operator decision, after the Hyprland/Wayland EGLStreams dead end --
# see BUILD-REPORT.md/AWESOME-X11-PLAN.md). The nouveau fallback entry
# was removed 2026-08-27, once the nvidia/X11/awesome path had proven
# itself stable across multiple reboots -- nouveau's own kernel driver
# is still compiled into the kernel image (removing that outright would
# mean a kernel reconfigure/rebuild, deliberately out of scope here),
# it's just never loaded: still blacklisted via cmdline below, same as
# before, just with no boot entry left that would ever lift the
# blacklist.
#
# Kernel renamed 2026-08-27 (operator request: "no audio in the name,
# something more permanent"): LOCALVERSION was "-audio", a leftover
# label from the session that first added HDA codec drivers, not a
# meaningful distinction any more since every kernel this project
# builds has those drivers now. Rebuilt with LOCALVERSION="" (plain
# "6.18.10", matching the project's original base-LFS naming) and
# CONFIG_TUN newly added (needed for Tailscale's userspace WireGuard,
# a separate kernel interface from the in-kernel WIREGUARD module).
# Confirmed stable across two real reboots (one to first boot the
# renamed kernel, a second after rebuilding nvidia's out-of-tree
# kernel modules against it -- those are proprietary and not part of
# the in-tree build, renaming the kernel silently orphaned them until
# rebuilt for the new /lib/modules/6.18.10/ path). The old "-audio"
# kernel/modules/fallback entry have been removed now that both boots
# came up clean -- same pattern as the nouveau fallback entry removed
# earlier tonight.
#
# Audio investigated and left unresolved 2026-08-27: it regressed from
# its documented working state (BUILD-REPORT.md's "Audio: HDMI output
# working" checkpoint) at some point across tonight's several reboots
# -- every boot since (5+ checked) shows both HDA controllers (onboard
# 00:1b.0, nvidia HDMI 01:00.1) failing to probe any codec, ending in
# `Cannot probe codecs, giving up` on both, with probe_mask unchanged
# and otherwise identical to the working checkpoint. Tried, each
# tested via a real reboot since snd_hda_intel is compiled into this
# kernel (not a loadable module, can't test live):
#   - single_cmd=1 alone: changes the failure signature (codecs
#     actually respond with real vendor IDs -- nvidia 0x10de0040,
#     Realtek 0x10ec0892 -- instead of timing out), but then fails
#     differently: `spurious response ...:0x2`, still ending in
#     `Cannot probe codecs, giving up`.
#   - bdl_pos_adj=0,0 alone: no effect, reverts to the plain timeout
#     failure (identical to no quirk flags at all).
#   - both together: identical to single_cmd alone: bdl_pos_adj
#     contributes nothing either way.
# single_cmd is the only flag that changes anything, and what it
# changes is which way it fails, not whether it fails. Left off here
# since it has no net benefit over the plain cmdline. This board's
# BIOS is 2012-era (F1, never updated) with already-known ACPI bugs
# (see the runtime-health audit) -- plausibly a real hardware/BIOS
# limitation, not something more cmdline quirk-guessing is likely to
# fix. Real, tested, unresolved -- not silently dropped.
#
# Kernel version updated 2026-09-09 for the LFS 13.1 bump: was 6.18.10-lfs-13.0-systemd,
# now 7.1.8-lfs-13.1-systemd, matching the fresh rebuild's actual /boot/vmlinuz-* name --
# caught because this overlay had never been touched since the 13.0-era boot history
# documented above, and a from-scratch build's blfs-intel-microcode step (which appends
# the initrd line above into a live /boot/grub/grub.cfg) has no real grub.cfg to append
# into until this overlay is applied per BOOTSTRAP.md, so that step now skips the append
# gracefully in that case rather than failing outright.
set default=0
set timeout=5

insmod part_msdos
insmod ext2

# Was `--fs-uuid 4ed155bc-b1da-4117-9f92-9c952e807880` until 2026-09-21: that is the
# fs-UUID sdb2 had *before* the re-image, recorded in BOOTSTRAP.md's disk table. Step 4
# mkfs'd sdb2, which minted a new one (cb1db9c1-245d-47f2-8628-1d87d9430777), and this
# line was never updated -- so every boot since has run a `search` that matches nothing
# on the machine. It booted anyway only because a failed `search` leaves $root at the
# partition GRUB itself loaded from, which happens to be the right one. Silent, and
# one unlucky BIOS boot-order change away from not being.
#
# Switched to `--label` rather than the new fs-UUID: a re-image re-mkfs's this partition
# and mints a fresh fs-UUID every time, while step 5 sets LABEL=LFSROOT back by hand, so
# the label is the identifier that actually survives the procedure that broke this one.
# `/etc/fstab` already keys off the same label for the same reason. This is GRUB, not the
# kernel, so a *filesystem* label is fine here -- the `root=PARTUUID=` note in
# BOOTSTRAP.md is about the kernel command line below, which has no initramfs to resolve
# anything for it and is correct as it stands.
search --set=root --label LFSROOT

set gfxpayload=1024x768x32

menuentry "GNU/Linux, Linux 7.1.8-lfs-13.1-systemd (nvidia-470xx, X11/awesome)" {
        linux /boot/vmlinuz-7.1.8-lfs-13.1-systemd root=PARTUUID=c2cd0612-02 ro loglevel=3 snd_hda_intel.probe_mask=0x1FF,0x1FF modprobe.blacklist=nouveau
        initrd /boot/microcode.img
}
# End /boot/grub/grub.cfg
